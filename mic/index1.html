<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>PAL Assistant</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="Style1.css">
    </head>
    <body onload="palSaysHello();">
        <div style="max-width: 280px; text-align:center; margin: auto; display: flex; flex-direction: column; align-items: center;">
            <h2>P.A.L</h2>
            
            <div class="pal-orb-container" onclick="startListening()">
                <!-- Floating Rings (CSS handle the core background) -->
                <svg width="210" height="210" id="pal-like" class="big_core">
                    <defs>
                        <filter id="light-circle">
                            <feGaussianBlur result="blurred" in="SourceGraphic" stdDeviation="2" />
                        </filter>
                        <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#c084fc; stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#7c3aed; stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    
                    <!-- Circle Outer Dash -->
                    <circle cx="105" cy="105" r="100" style="fill: transparent; stroke: #a855f7; stroke-width: 1; stroke-dasharray: 40, 10; opacity: 0.5;">
                        <animateTransform attributeName="transform" type="rotate" from="0 105 105" to="360 105 105" dur="15s" repeatCount="indefinite" />
                    </circle>
                    
                    <!-- Middle Dash Circle -->
                    <circle cx="105" cy="105" r="80" style="fill: transparent; stroke: #c084fc; stroke-width: 8; stroke-dasharray: 2, 3; opacity: 0.6;">
                        <animateTransform attributeName="transform" type="rotate" from="0 105 105" to="360 105 105" dur="8s" repeatCount="indefinite" />
                    </circle>
                    
                    <!-- Inner Rotating Ring -->
                    <circle cx="105" cy="105" r="61" style="fill: transparent; stroke: #7c3aed; stroke-width: 2; stroke-dasharray: 30, 15; opacity: 0.7;">
                        <animateTransform attributeName="transform" type="rotate" from="0 105 105" to="-360 105 105" dur="10s" repeatCount="indefinite" />
                    </circle>
                    
                    <!-- Inner Glow Circle -->
                    <circle cx="105" cy="105" r="50" style="fill: transparent; stroke: #a855f7; stroke-width: 12; filter: url(#light-circle); opacity: 0.4;"></circle>
                    
                    <!-- Center Core Circle -->
                    <circle cx="105" cy="105" r="40" style="fill: transparent; stroke: #c084fc; stroke-width: 2; opacity: 0.8;"></circle>
                    
                    <!-- Central Trigger (The Triangle) -->
                    <path d="M 105 125 L 132 98 L 78 98 z" style="fill: url(#purpleGradient); stroke: #fff; stroke-width:1" id="microphoneButton"></path>
                </svg>
            </div>
        </div>
        
        <script src="./app1.js"></script>
    </body>
</html>

<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <title>PAL</title>
    <meta name="description" content="PAL – Personal AI Assistant" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://codepen.io/FlyingEmu/pen/cjBzr.css" />
    <link rel="stylesheet" href="Style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
  </head>
  <body onload="palStartingReply()">
    <div class="scroll">
      <!-- ── Left Menu ── -->
      <div id="leftmenu">
        <div id="date_time">
          <div id="date" class="semi_arc e4">
            <div class="semi_arc_2 e4_1">
              <div class="counterspin4"></div>
            </div>
            <div style="font-size: 36px; margin-top: 22px; font-family:'Orbitron',sans-serif; color:#c084fc;" id="dateValue"></div>
            <div style="font-size: 14px; letter-spacing:3px; text-transform:uppercase;" id="monthValue"></div>
          </div>

          <div id="time" class="arc e1">
            <div style="font-size: 20px; margin-left: -10px; margin-top: 23px; font-family:'Orbitron',sans-serif;" id="timeValue"></div>
            <div style="font-size: 13px; margin-top: 10px; letter-spacing:2px;" id="weekDayValue"></div>
          </div>
        </div>

        <p class="title">Performance</p>
        <div class="hline title_underline"></div>

        <span class="menuitem entypo-gauge" style="font-size:26px; margin-left:10px;">
          <p id="cpu" class="caption" style="font-size:14px;">CPU Usage: 19%</p>
        </span>
        <br />

        <span class="menuitem entypo-chart-area" style="font-size:26px; margin-left:10px;">
          <p id="ram" class="caption" style="font-size:14px;"></p>
        </span>
        <br />

        <span class="menuitem entypo-chart-pie" style="font-size:26px; margin-left:10px;">
          <p id="proc" class="caption" style="font-size:14px;">Processes: 73</p>
        </span>

        <p class="title">Shortcuts</p>
        <div class="hline title_underline"></div>

        <div class="menu">
          <button class="menuitem">
            <span class="entypo-right-open" />
            <p class="caption" onclick="playAudio()">User</p>
          </button>
          <button class="menuitem">
            <span class="entypo-right-open" />
            <p class="caption" onclick="playAudio()">Documents</p>
          </button>
          <button class="menuitem">
            <span class="entypo-right-open" />
            <p class="caption" onclick="playAudio()">Computer</p>
          </button>
          <button class="menuitem">
            <span class="entypo-right-open" />
            <p class="caption">Control Panel</p>
          </button>

          <hr style="border-color: transparent; margin: 0" />
          <div class="hline" style="margin-top: 5px; margin-bottom: 5px;"></div>

          <button class="menuitem">
            <span class="entypo-right-open" />
            <p class="caption">Custom Path 1</p>
          </button>
          <button class="menuitem">
            <span class="entypo-right-open" />
            <p class="caption">Custom Path 2</p>
          </button>
          <button class="menuitem">
            <span class="entypo-right-open" />
            <p class="caption">Custom Path 3</p>
          </button>
        </div>

        <p class="title">Social</p>
        <div class="hline title_underline"></div>

        <div class="app_icon entypo-facebook-squared"></div>
        <div class="app_icon entypo-twitter"></div>
        <div class="app_icon entypo-gplus"></div>
        <div class="app_icon entypo-skype"></div>
        <div class="app_icon entypo-tumblr"></div>
        <div class="app_icon entypo-pinterest"></div>
        <div class="app_icon entypo-soundcloud"></div>
        <div class="app_icon entypo-stumbleupon"></div>
      </div>

      <!-- ── Right Menu ── -->
      <div id="rightmenu">
        <p class="title" style="text-align: left; margin-left: 10px;">Notes</p>
        <div id="particle10" class="hline"></div>
        <div id="particle11" class="hline"></div>
        <div id="particle12" class="vline"></div>
        <textarea id="note_input" rows="12" cols="44">
PAL — Personal AI Assistant

To Complete:
- Right Menu (this side of the screen)
  - Make this note restricted to 11 rows
  - Fill in empty space below
- Weather widget next to date/time
- Place quick access taskbar down bottom
- Fill in space at the top</textarea>
        >
        <div id="temperature">
          <div id="date_time">
            <div id="date" class="semi_arc e4">
              <div class="semi_arc_2 e4_1">
                <div class="counterspin4"></div>
              </div>
              <div style="font-size: 30px; margin-top: 25px; font-family:'Orbitron',sans-serif;" id="tempValue"></div>
              <div style="font-size: 22px;"><sup>0</sup>c</div>
              <div style="font-size: 16px; letter-spacing:2px;">Temp.</div>
            </div>

            <div id="time" class="arc e1">
              <div style="font-size: 20px; margin-right: 8px; margin-top: 23px; font-family:'Orbitron',sans-serif;" id="humidityValue"></div>
              <div style="font-size: 15px; margin-top: 10px; letter-spacing:2px;">Humidity</div>
            </div>
          </div>
        </div>

        <div id="time1" class="arc e1">
          <div id="weatherImage" style="border-radius: 50%"></div>
        </div>
      </div>

      <!-- ── AI Thinking Process Log ── -->
      <div id="process_log_container">
        <div class="log_header">SYSTEM LOG // THINKING_PROCESS</div>
        <div id="process_log"></div>
      </div>

      <!-- ── PAL Central Orb (replaces arc reactor) ── -->
      <div id="arc_container">
        <button id="microphoneButton">
          <!-- Orbiting rings -->
          <div class="arc_reactor">
            <div class="orb-ring orb-ring-1"></div>
            <div class="orb-ring orb-ring-2"></div>
            <div class="orb-ring orb-ring-3"></div>

            <!-- The orb -->
            <div class="pal-orb">
              <span class="pal-orb-label">PAL</span>
              <div id="palSubLabel"></div>
            </div>

            <!-- Tick marks (kept for structural parity) -->
            <div class="case_container">
              <div class="e7">
                <div class="semi_arc_3 e5_1">
                  <div class="semi_arc_3 e5_2">
                    <div class="semi_arc_3 e5_3">
                      <div class="semi_arc_3 e5_4" id="mainCircle"></div>
                    </div>
                  </div>
                </div>
              </div>
              <ul class="marks">
                <li></li><li></li><li></li><li></li><li></li>
                <li></li><li></li><li></li><li></li><li></li>
                <li></li><li></li><li></li><li></li><li></li>
                <li></li><li></li><li></li><li></li><li></li>
                <li></li><li></li><li></li><li></li><li></li>
                <li></li><li></li><li></li><li></li><li></li>
                <li></li><li></li><li></li><li></li><li></li>
                <li></li><li></li><li></li><li></li><li></li>
                <li></li><li></li><li></li><li></li><li></li>
                <li></li><li></li><li></li><li></li><li></li>
                <li></li><li></li><li></li><li></li><li></li>
                <li></li><li></li><li></li><li></li><li></li>
              </ul>
            </div>
          </div>
        </button>
      </div>


      <!-- ── Particles / Decorative ── -->
      <!-- Left Menu Particles -->
      <canvas id="particle1" width="20" height="500"></canvas>
      <script>
        var canvas = document.getElementById("particle1");
        var context = canvas.getContext("2d");
        context.beginPath();
        context.moveTo(0, 0);
        context.lineTo(0, 70);
        context.lineTo(10, 85);
        context.lineTo(10, 135);
        context.lineTo(0, 150);
        context.lineTo(0, 480);
        context.lineTo(5, 490);
        context.lineTo(10, 490);
        context.lineTo(20, 490);
        context.lineTo(20, 250);
        context.lineTo(10, 235);
        context.lineTo(10, 185);
        context.lineTo(20, 170);
        context.lineTo(20, 40);
        context.lineTo(10, 30);
        context.lineTo(10, 20);
        context.closePath();
        context.lineWidth = 1;
        context.fillStyle = "rgba(168,85,247,0.18)";
        context.fill();
        context.strokeStyle = "transparent";
        context.stroke();
      </script>

      <canvas id="particle1_1" width="40" height="510"></canvas>
      <script>
        var canvas = document.getElementById("particle1_1");
        var context = canvas.getContext("2d");
        context.beginPath();
        context.lineTo(0, 0);
        context.lineTo(10, 15);
        context.lineTo(10, 65);
        context.lineTo(0, 80);
        context.lineTo(0, 0);
        context.closePath();
        context.lineWidth = 1;
        context.fillStyle = "rgba(168,85,247,0.18)";
        context.fill();
        context.strokeStyle = "transparent";
        context.stroke();
      </script>

      <canvas id="particle1_2" width="40" height="510"></canvas>
      <script>
        var canvas = document.getElementById("particle1_2");
        var context = canvas.getContext("2d");
        context.beginPath();
        context.lineTo(10, 80);
        context.lineTo(0, 65);
        context.lineTo(0, 15);
        context.lineTo(10, 0);
        context.lineTo(10, 80);
        context.closePath();
        context.lineWidth = 1;
        context.fillStyle = "rgba(168,85,247,0.18)";
        context.fill();
        context.strokeStyle = "transparent";
        context.stroke();
      </script>

      <div id="particle1_3">> > > ></div>
      <div id="particle2">▶<br />▶<br />▶</div>
      <div id="particle3" class="vline" />
      <div id="particle4" class="vline" />
      <div id="particle5" class="vline" />
      <div id="particle6" class="vline" />
      <div id="particle7" class="vline" />
      <div id="particle8" class="vline" />
      <div id="particle9" class="vline" />
    </div>

    <!-- Status bar -->
    <div class="pal-status-bar" id="palStatusBar">P . A . L &nbsp;—&nbsp; Click anywhere to activate Passive Listening</div>

    <script>
      $(document).ready(function() {
        $("#date_time").hide().delay(2000).fadeIn(1000);
        $(".title").hide().delay(3000).fadeIn(1000);
        $("#cpu").hide().delay(4000).fadeIn(1000);
        $("#ram").hide().delay(4500).fadeIn(1000);
        $("#proc").hide().delay(5000).fadeIn(1000);
        $(".caption").hide().delay(6000).fadeIn(1000);
        $("#note_input").hide().delay(7000).fadeIn(1000);
        $("#temperature").hide().delay(8000).fadeIn(1000);
        $("#mainCircle").hide().delay(8000).fadeIn(1000);
        $("#time1").hide().delay(9000).fadeIn(1000);
        $(".pal-status-bar").hide().delay(9500).fadeIn(1500);
      });
    </script>
    <script src="./index_JS.js"></script>
  </body>
</html>
